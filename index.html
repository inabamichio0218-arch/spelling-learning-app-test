<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>英単語スペル練習 TEST</title>
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#222;
    font-family:"Yu Gothic UI","Yu Gothic",sans-serif;
  }

  .stage{
    position:absolute;
    left:50%;
    top:50%;
    width:min(100vw,calc(100vh * 16 / 9));
    height:min(100vh,calc(100vw * 9 / 16));
    transform:translate(-50%,-50%);
    overflow:hidden;
    background:#000;
  }

  #appFrame{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
    display:block;
    background:#000;
  }

  #infoButton{
    position:absolute;
    right:1.6%;
    top:2.2%;
    width:5.3%;
    aspect-ratio:1/1;
    padding:0;
    border:0;
    background:transparent;
    cursor:pointer;
    z-index:20;
    transition:transform .15s ease;
  }
  #infoButton:hover{transform:scale(1.06)}
  #infoButton:active{transform:scale(.96)}
  #infoButton img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }

  #aboutPanel{
    position:absolute;
    inset:0;
    display:none;
    z-index:30;
    background:#395d55;
  }
  #aboutPanel.open{display:block}

  #aboutImage{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:fill;
    display:block;
  }

  .aboutBtn{
    position:absolute;
    padding:0;
    border:0;
    background:transparent;
    cursor:pointer;
    z-index:31;
    transition:transform .15s ease, filter .15s ease;
  }
  .aboutBtn:hover{
    transform:scale(1.035);
    filter:brightness(1.03);
  }
  .aboutBtn:active{transform:scale(.97)}
  .aboutBtn img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }

  /* about.png のレイアウトに合わせた配置 */
  #youtubeButton{
    left:12.7%;
    top:69.6%;
    width:24.0%;
    height:8.8%;
  }

  #backQuestionButton{
    left:28.0%;
    top:80.5%;
    width:44.0%;
    height:15.5%;
  }

  /* キーボード利用者向け */
  button:focus-visible, a:focus-visible{
    outline:4px solid #fff;
    outline-offset:3px;
    border-radius:12px;
  }
</style>
</head>
<body>

<div class="stage">
  <!-- 本番の英単語アプリをそのまま表示 -->
  <iframe
    id="appFrame"
    src="https://inabamichio0218-arch.github.io/spelling-learning-app/"
    title="英単語スペル練習"
    allowfullscreen>
  </iframe>

  <!-- 教材情報 -->
  <button id="infoButton" type="button" aria-label="この教材について">
    <img src="info.png" alt="">
  </button>

  <!-- この教材について -->
  <section id="aboutPanel" aria-hidden="true">
    <img id="aboutImage" src="about.png" alt="この教材について">

    <a
      id="youtubeButton"
      class="aboutBtn"
      href="https://www.youtube.com/@PowerPoint-MVP"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="YouTubeで見る">
      <img src="btn-youtube.png" alt="YouTubeで見る">
    </a>

    <button
      id="backQuestionButton"
      class="aboutBtn"
      type="button"
      aria-label="問題にもどる">
      <img src="btn-back-question.png" alt="問題にもどる">
    </button>
  </section>
</div>

<script>
  const infoButton = document.getElementById("infoButton");
  const aboutPanel = document.getElementById("aboutPanel");
  const backQuestionButton = document.getElementById("backQuestionButton");

  function openAbout(){
    aboutPanel.classList.add("open");
    aboutPanel.setAttribute("aria-hidden","false");
    backQuestionButton.focus();
  }

  function closeAbout(){
    aboutPanel.classList.remove("open");
    aboutPanel.setAttribute("aria-hidden","true");
    infoButton.focus();
  }

  infoButton.addEventListener("click", openAbout);
  backQuestionButton.addEventListener("click", closeAbout);

  document.addEventListener("keydown", (e)=>{
    if(e.key === "Escape" && aboutPanel.classList.contains("open")){
      closeAbout();
    }
  });
</script>

</body>
</html>
